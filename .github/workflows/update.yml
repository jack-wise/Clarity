# Collects news every 30 minutes and commits the refreshed data, which GitHub
# Pages (serving /docs on main) picks up automatically. Mirrors the collector
# pattern used by the jack-wise/AI-Newsletter repo.
#
# Fully keyless: every source (Google News RSS + direct outlet RSS feeds) and
# the bias/category classification run with Node's built-in fetch — no
# secrets, no npm install, no API keys required.

name: update-clarity

on:
  schedule:
    # GitHub's scheduler is best-effort and can run a few minutes late under
    # load; that's fine for a 30-minute news cadence.
    - cron: "12,42 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-clarity
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect news
        run: node scripts/collect.mjs

      - name: Commit refreshed data
        run: |
          git config user.name "clarity-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes this cycle."
            exit 0
          fi
          git commit -m "data: refresh $(date -u +'%Y-%m-%dT%H:%MZ')"
          # A concurrent push (e.g. a manual edit) should not kill the cycle.
          git pull --rebase origin main
          git push origin main
