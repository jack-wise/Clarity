# Collects news every 30 minutes and commits the refreshed data, which GitHub
# Pages (serving /docs on main) picks up automatically. Mirrors the collector
# pattern used by the jack-wise/AI-Newsletter repo.
#
# Fully keyless by default: every source (Google News RSS + direct outlet RSS
# feeds) and the bias/category classification run with Node's built-in fetch
# — no secrets, no npm install, no API keys required. Setting the
# ANTHROPIC_API_KEY repo secret upgrades The Brief from a deterministic
# template to an AI-written narrative (Claude Haiku); everything else is
# unaffected either way.

name: update-clarity

on:
  schedule:
    # GitHub's scheduler is best-effort and can run a few minutes late under
    # load; that's fine for a 30-minute news cadence.
    - cron: "12,42 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-clarity
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The `secrets` context isn't allowed in step `if:` expressions, so map it
    # to a job-level env var that `if:` can read.
    env:
      HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Only install the Anthropic SDK when the key is actually set — the
      # collector's RSS/classification/bias pipeline needs zero dependencies,
      # so a quiet repo with no key pays no install cost.
      - name: Install deps (AI brief)
        if: ${{ env.HAS_ANTHROPIC == 'true' }}
        run: npm ci || npm install

      - name: Collect news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEF_MODEL: ${{ vars.BRIEF_MODEL }}
        run: node scripts/collect.mjs

      - name: Commit refreshed data
        run: |
          git config user.name "clarity-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes this cycle."
            exit 0
          fi
          git commit -m "data: refresh $(date -u +'%Y-%m-%dT%H:%MZ')"
          # A concurrent push (e.g. a manual edit) should not kill the cycle.
          git pull --rebase origin main
          git push origin main
